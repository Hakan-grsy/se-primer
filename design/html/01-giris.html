<div class="absolute left-0 top-2 bottom-2 w-1 rounded-r bg-primary-container"></div>

<!-- QUESTION 2: Rol -->

<label class="text-label-lg font-label-lg text-on-surface flex items-center gap-1.5">

<div class="absolute left-0 top-2 bottom-2 w-1 rounded-r bg-primary-container"></div>
<span class="text-body-md font-body-md text-on-surface font-semibold pl-2">Backend geliştirici</span>
<span class="w-5 h-5 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[15px] font-bold">check</span>
</span>
</button>
<!-- Option 2 -->
<button class="w-full text-left min-h-[50px] p-3.5 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all flex items-center justify-between group active:scale-[0.99]" data-value="qa" type="button">
<span class="text-body-md font-body-md text-on-surface-variant font-medium group-hover:text-on-surface">Test (QA) mühendisi</span>
<span class="w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</span>
</button>
<!-- Option 3 -->
<button class="w-full text-left min-h-[50px] p-3.5 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all flex items-center justify-between group active:scale-[0.99]" data-value="lead" type="button">
<span class="text-body-md font-body-md text-on-surface-variant font-medium group-hover:text-on-surface">Takım lideri</span>
<span class="w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center text-transparent">
<span class="material-symbols-outlined text-[16px]">check</span>
</span>
</button>
</div>
</section>
<!-- QUESTION 3: Hedef Konu -->
<section class="flex flex-col gap-2.5">
<div class="flex items-center justify-between">
<label class="text-label-lg font-label-lg text-on-surface flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded bg-primary-container"></span>
          Ne öğrenmek istiyorsun?
        </label>
<span class="text-label-md font-label-md text-secondary">03 / 03</span>
</div>
<div class="flex flex-col gap-2" data-radio-group="goal">
<!-- Option 1 -->
<button class="w-full text-left min-h-[50px] p-3.5 rounded-xl bg-surface-container hover:bg-surface-container-high transition-all flex items-center justify-between group active:scale-[0.99]" data-value="debugging" type="button">
<span class="text-body-md font-body-md text-on-surface-variant font-medium group-hover:text-on-surface">Hata ayıklama</span>

</span>

<!-- Option 2 (SELECTED) -->

<div class="absolute left-0 top-2 bottom-2 w-1 rounded-r bg-primary-container"></div>

<span class="text-body-md font-body-md text-on-surface-variant font-medium group-hover:text-on-surface">Veri güvenliği ve KVKK</span>

<!-- Sticky Bottom Commit Trigger -->
<div class="fixed bottom-0 left-0 right-0 p-4 pb-safe bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/95 to-transparent z-40">
<div class="max-w-xl mx-auto w-full">
<button class="w-full min-h-[52px] h-[52px] bg-primary-container hover:bg-surface-tint active:scale-[0.98] transition-transform rounded-xl flex items-center justify-center gap-2 text-on-primary font-headline-sm text-headline-sm shadow-lg font-bold" id="btn-start" type="button">
<span>Başla</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</div>
</div>
</div>
<script>
  // Simple interactive selection handling for option chips
  document.querySelectorAll('[data-radio-group]').forEach(group => {
    const buttons = group.querySelectorAll('button');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          b.classList.remove('selected-option', 'bg-surface-container-high', 'shadow-md');
          b.classList.add('bg-surface-container');
          
          const pip = b.querySelector('.absolute.left-0');
          if (pip) pip.remove();

          const label = b.querySelector('span:first-of-type');
          if (label) {
            label.className = 'text-body-md font-body-md text-on-surface-variant font-medium group-hover:text-on-surface';
          }

          const iconContainer = b.querySelector('span:last-of-type');
          if (iconContainer) {
            iconContainer.className = 'w-5 h-5 rounded-full bg-surface-container-high flex items-center justify-center text-transparent';
            iconContainer.innerHTML = '<span class="material-symbols-outlined text-[16px]">check</span>';
          }
        });

        // Activate clicked button
        btn.classList.add('selected-option', 'bg-surface-container-high', 'shadow-md');
        btn.classList.remove('bg-surface-container');

        const activePip = document.createElement('div');
        activePip.className = 'absolute left-0 top-2 bottom-2 w-1 rounded-r bg-primary-container';
        btn.prepend(activePip);

        const activeLabel = btn.querySelector('span:first-of-type');
        if (activeLabel) {
          activeLabel.className = 'text-body-md font-body-md text-on-surface font-semibold pl-2';
        }

        const activeIconContainer = btn.querySelector('span:last-of-type');
        if (activeIconContainer) {
          activeIconContainer.className = 'w-5 h-5 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shadow-sm';
          activeIconContainer.innerHTML = '<span class="material-symbols-outlined text-[15px] font-bold">check</span>';
        }
      });
    });
  });

  // Micro-feedback on primary launch
  const startBtn = document.getElementById('btn-start');
  if (startBtn) {
    startBtn.addEventListener('click', () => {
      startBtn.classList.add('opacity-90');
      const textSpan = startBtn.querySelector('span');
      if (textSpan) {
        textSpan.textContent = 'Yükleniyor...';
      }
      setTimeout(() => {
        if (textSpan) textSpan.textContent = 'Başla';
        startBtn.classList.remove('opacity-90');
      }, 900);
    });
  }
</script></main></body></html>
