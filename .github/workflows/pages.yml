# Oyunu GitHub Pages'te yayınlar: https://hakan-grsy.github.io/se-primer/
# main'e her push'ta çalışır. Model Hugging Face'teki sabit commit'ten indirilir
# (app/src/model/yayin.json). Sunucu olmadığı için AI tutor ve veri toplama bu yayında kapalıdır.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Bağımlılıklar
        working-directory: app
        run: npm ci
      - name: Derleme
        working-directory: app
        env:
          VITE_BASE: /se-primer/
          VITE_STATIK: '1'
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
